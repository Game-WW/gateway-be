syntax = "proto3";

package users;

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "users/auth.proto";
import "users/identity.proto";
import "users/user.proto";

option go_package = "github.com/Game-WW/gateway-be/gen/users;userspb";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Chess API"
    version: "1.0"
    description: "Авторизация на cookie: /auth/login/{provider} ставит access_token и refresh_token, дальше браузер шлёт их сам.\n\nОшибки всегда в одном формате: {\"code\": <gRPC-код>, \"message\": \"...\", \"details\": []}. Решения на фронте — по HTTP-статусу, message только для логов."
  }
  tags: {
    name: "auth"
    description: "Вход, обновление токена, выход"
  }
  tags: {
    name: "users"
    description: "Пользователи"
  }
  tags: {
    name: "identity"
    description: "Способы входа пользователя: список, привязка, отвязка"
  }
  security_definitions: {
    security: {
      key: "IdToken"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "Bearer <id_token провайдера>"
      }
    }
  }
};

service UsersService {
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {post: "/api/v1/auth/login/{provider}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "auth"
      summary: "Вход через внешнего провайдера"
      description: "Проверяет id_token провайдера и ставит cookie access_token и refresh_token."
      security: {
        security_requirement: {
          key: "IdToken"
          value: {}
        }
      }
      responses: {
        key: "400"
        value: {
          description: "Неизвестный провайдер"
          schema: {json_schema: {ref: ".google.rpc.Status"}}
          examples: {
            key: "application/json"
            value: "{\"code\": 3, \"message\": \"invalid argument\", \"details\": []}"
          }
        }
      }
      responses: {
        key: "401"
        value: {
          description: "Нет Bearer или невалидный id_token"
          schema: {json_schema: {ref: ".google.rpc.Status"}}
          examples: {
            key: "application/json"
            value: "{\"code\": 16, \"message\": \"unauthenticated\", \"details\": []}"
          }
        }
      }
      responses: {
        key: "500"
        value: {
          description: "Ошибка users-be (БД и т.п.)"
          schema: {json_schema: {ref: ".google.rpc.Status"}}
          examples: {
            key: "application/json"
            value: "{\"code\": 13, \"message\": \"internal error\", \"details\": []}"
          }
        }
      }
    };
  }

  rpc Refresh(RefreshRequest) returns (RefreshResponse) {
    option (google.api.http) = {post: "/api/v1/auth/refresh"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "auth"
      summary: "Обновить access_token"
      description: "Нужна cookie refresh_token. Ставит новую cookie access_token."
      responses: {
        key: "401"
        value: {
          description: "Нет cookie refresh_token, или токен не найден / истёк — нужен вход заново"
          schema: {json_schema: {ref: ".google.rpc.Status"}}
          examples: {
            key: "application/json"
            value: "{\"code\": 16, \"message\": \"unauthenticated\", \"details\": []}"
          }
        }
      }
      responses: {
        key: "500"
        value: {
          description: "Ошибка users-be (БД и т.п.)"
          schema: {json_schema: {ref: ".google.rpc.Status"}}
          examples: {
            key: "application/json"
            value: "{\"code\": 13, \"message\": \"internal error\", \"details\": []}"
          }
        }
      }
    };
  }

  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (google.api.http) = {post: "/api/v1/auth/logout"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "auth"
      summary: "Выход"
      description: "Удаляет refresh_token на сервере и очищает обе cookie. Без cookie тоже отвечает 200."
      responses: {
        key: "500"
        value: {
          description: "Ошибка users-be (БД и т.п.)"
          schema: {json_schema: {ref: ".google.rpc.Status"}}
          examples: {
            key: "application/json"
            value: "{\"code\": 13, \"message\": \"internal error\", \"details\": []}"
          }
        }
      }
    };
  }

  rpc GetMe(GetMeRequest) returns (GetMeResponse) {
    option (google.api.http) = {
      get: "/api/v1/users/me"
      response_body: "user"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "users"
      summary: "Текущий пользователь"
      description: "Нужна cookie access_token (ставит /auth/google)."
      responses: {
        key: "401"
        value: {
          description: "Нет cookie access_token или токен истёк — вызвать /auth/refresh"
          schema: {json_schema: {ref: ".google.rpc.Status"}}
          examples: {
            key: "application/json"
            value: "{\"code\": 16, \"message\": \"unauthenticated\", \"details\": []}"
          }
        }
      }
      responses: {
        key: "404"
        value: {
          description: "Пользователь из токена удалён из БД"
          schema: {json_schema: {ref: ".google.rpc.Status"}}
          examples: {
            key: "application/json"
            value: "{\"code\": 5, \"message\": \"not found\", \"details\": []}"
          }
        }
      }
      responses: {
        key: "500"
        value: {
          description: "Ошибка users-be (БД и т.п.)"
          schema: {json_schema: {ref: ".google.rpc.Status"}}
          examples: {
            key: "application/json"
            value: "{\"code\": 13, \"message\": \"internal error\", \"details\": []}"
          }
        }
      }
    };
  }

  rpc ListIdentities(ListIdentitiesRequest) returns (ListIdentitiesResponse) {
    option (google.api.http) = {get: "/api/v1/identities"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "identity"
      summary: "Способы входа"
      description: "Все включённые провайдеры и уже привязанные. linked = true — можно отвязать, false — привязать."
      responses: {
        key: "401"
        value: {
          description: "Нет cookie access_token или токен истёк — вызвать /auth/refresh"
          schema: {json_schema: {ref: ".google.rpc.Status"}}
          examples: {
            key: "application/json"
            value: "{\"code\": 16, \"message\": \"unauthenticated\", \"details\": []}"
          }
        }
      }
      responses: {
        key: "500"
        value: {
          description: "Ошибка users-be (БД и т.п.)"
          schema: {json_schema: {ref: ".google.rpc.Status"}}
          examples: {
            key: "application/json"
            value: "{\"code\": 13, \"message\": \"internal error\", \"details\": []}"
          }
        }
      }
    };
  }

  rpc LinkIdentity(LinkIdentityRequest) returns (LinkIdentityResponse) {
    option (google.api.http) = {
      post: "/api/v1/identities/{provider}"
      response_body: "identity"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "identity"
      summary: "Привязать способ входа"
      description: "Нужны cookie access_token (кто привязывает) и Bearer id_token провайдера (что привязываем). Повторная привязка того же аккаунта — 200."
      security: {
        security_requirement: {
          key: "IdToken"
          value: {}
        }
      }
      responses: {
        key: "400"
        value: {
          description: "Неизвестный или выключенный провайдер"
          schema: {json_schema: {ref: ".google.rpc.Status"}}
          examples: {
            key: "application/json"
            value: "{\"code\": 3, \"message\": \"invalid argument\", \"details\": []}"
          }
        }
      }
      responses: {
        key: "401"
        value: {
          description: "Нет cookie access_token, нет Bearer или невалидный id_token"
          schema: {json_schema: {ref: ".google.rpc.Status"}}
          examples: {
            key: "application/json"
            value: "{\"code\": 16, \"message\": \"unauthenticated\", \"details\": []}"
          }
        }
      }
      responses: {
        key: "409"
        value: {
          description: "Этот аккаунт провайдера привязан к другому пользователю, или у пользователя уже привязан другой аккаунт этого провайдера"
          schema: {json_schema: {ref: ".google.rpc.Status"}}
          examples: {
            key: "application/json"
            value: "{\"code\": 6, \"message\": \"already exists\", \"details\": []}"
          }
        }
      }
      responses: {
        key: "500"
        value: {
          description: "Ошибка users-be (БД и т.п.)"
          schema: {json_schema: {ref: ".google.rpc.Status"}}
          examples: {
            key: "application/json"
            value: "{\"code\": 13, \"message\": \"internal error\", \"details\": []}"
          }
        }
      }
    };
  }

  rpc UnlinkIdentity(UnlinkIdentityRequest) returns (UnlinkIdentityResponse) {
    option (google.api.http) = {delete: "/api/v1/identities/{provider}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "identity"
      summary: "Отвязать способ входа"
      description: "Нужна cookie access_token. Если провайдер не привязан — тоже 200."
      responses: {
        key: "400"
        value: {
          description: "Неизвестный провайдер (code 3) или это последний способ входа (code 9)"
          schema: {json_schema: {ref: ".google.rpc.Status"}}
          examples: {
            key: "application/json"
            value: "{\"code\": 9, \"message\": \"failed precondition\", \"details\": []}"
          }
        }
      }
      responses: {
        key: "401"
        value: {
          description: "Нет cookie access_token или токен истёк — вызвать /auth/refresh"
          schema: {json_schema: {ref: ".google.rpc.Status"}}
          examples: {
            key: "application/json"
            value: "{\"code\": 16, \"message\": \"unauthenticated\", \"details\": []}"
          }
        }
      }
      responses: {
        key: "500"
        value: {
          description: "Ошибка users-be (БД и т.п.)"
          schema: {json_schema: {ref: ".google.rpc.Status"}}
          examples: {
            key: "application/json"
            value: "{\"code\": 13, \"message\": \"internal error\", \"details\": []}"
          }
        }
      }
    };
  }
}
