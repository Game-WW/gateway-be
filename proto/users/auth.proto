syntax = "proto3";

package users;

import "google/api/field_behavior.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/Game-WW/gateway-be/gen/users;userspb";

message LoginRequest {
  string provider = 1 [
    (google.api.field_behavior) = REQUIRED,
    // enum для параметра пути генератор Swagger не переносит — значения перечислены в description.
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {description: "Провайдер, выдавший id_token: google"}
  ];
}

message LoginResponse {}

message RefreshRequest {}

message RefreshResponse {}

message LogoutRequest {}

message LogoutResponse {}
