syntax = "proto3";

package auth;

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/Game-WW/gateway-be/gen/auth;authpb";

// Общая шапка Swagger — для всего API, все proto сливаются в один файл (allow_merge).
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Chess API"
    version: "1.0"
    description: "Авторизация на cookie: /auth/google ставит access_token и refresh_token, дальше браузер шлёт их сам."
  }
  security_definitions: {
    security: {
      key: "GoogleIdToken"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "Bearer <google id_token>"
      }
    }
  }
};

// Токены ходят через metadata, а не через тело:
//   запрос: authorization (Bearer google id_token), x-refresh-token, x-user-agent, x-forwarded-for
//   ответ:  x-access-token, x-refresh-token, x-logout — gateway превращает их в cookie
service AuthService {
  rpc AuthGoogle(AuthGoogleRequest) returns (AuthGoogleResponse) {
    option (google.api.http) = {post: "/api/v1/auth/google"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Вход через Google"
      description: "Ставит cookie access_token и refresh_token."
      security: {
        security_requirement: {
          key: "GoogleIdToken"
          value: {}
        }
      }
      responses: {
        key: "401"
        value: {description: "Нет Bearer или невалидный Google id_token"}
      }
    };
  }
  rpc Refresh(RefreshRequest) returns (RefreshResponse) {
    option (google.api.http) = {post: "/api/v1/auth/refresh"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Обновить access_token"
      description: "Нужна cookie refresh_token. Ставит новую cookie access_token."
      responses: {
        key: "401"
        value: {description: "Нет cookie refresh_token, или токен не найден / истёк"}
      }
    };
  }
  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (google.api.http) = {post: "/api/v1/auth/logout"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Выход"
      description: "Удаляет refresh_token на сервере и очищает обе cookie."
    };
  }
}

message AuthGoogleRequest {}

message AuthGoogleResponse {}

message RefreshRequest {}

message RefreshResponse {}

message LogoutRequest {}

message LogoutResponse {}
