syntax = "proto3";

package user;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/Game-WW/gateway-be/gen/user;userpb";

service UserService {
  rpc GetMe(GetMeRequest) returns (GetMeResponse) {
    option (google.api.http) = {
      get: "/api/v1/users/me"
      response_body: "user"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Текущий пользователь"
      description: "Нужна cookie access_token (ставит /auth/google)."
      responses: {
        key: "401"
        value: {description: "Нет cookie access_token или токен истёк — вызвать /auth/refresh"}
      }
      responses: {
        key: "404"
        value: {description: "Пользователь не найден"}
      }
    };
  }
}

message GetMeRequest {}

message GetMeResponse {
  User user = 1;
}

message User {
  reserved 5;
  reserved "google_id";

  string id = 1;
  optional string username = 2;
  optional string email = 3;
  optional string phone_number = 4;
  google.protobuf.Timestamp created_at = 6;
}
